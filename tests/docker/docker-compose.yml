# Bancos locais com dados fictícios para validar os drivers do agente.
# Uso: docker compose up -d postgres mongo firebird   (mssql e oracle são pesados; suba um por vez)
#      ./seed.sh <postgres|mssql|mongo|firebird|oracle>
name: sdz-agent-drivers
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${MOCK_PASSWORD}
      POSTGRES_DB: agent_mock
    ports: ["15432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agent -d agent_mock"], interval: 5s, retries: 20 }

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: agent
      MONGO_INITDB_ROOT_PASSWORD: ${MOCK_PASSWORD}
    ports: ["17017:27017"]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"], interval: 5s, retries: 20 }

  firebird:
    image: firebirdsql/firebird:5
    environment:
      FIREBIRD_ROOT_PASSWORD: ${MOCK_PASSWORD}
      FIREBIRD_USER: agent
      FIREBIRD_PASSWORD: ${MOCK_PASSWORD}
      FIREBIRD_DATABASE: agent_mock.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    ports: ["13050:3050"]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["11433:1433"]

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${MOCK_PASSWORD}
      APP_USER: agent_mock
      APP_USER_PASSWORD: ${MOCK_PASSWORD}
    ports: ["11521:1521"]
    healthcheck: { test: ["CMD", "healthcheck.sh"], interval: 10s, retries: 60 }
