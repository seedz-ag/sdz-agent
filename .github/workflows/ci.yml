name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Install native deps for the Fyne tray (OpenGL/X11) and the Windows cross toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libgl1-mesa-dev xorg-dev gcc-mingw-w64-x86-64
      - name: Build (linux-x64 + win-x64, agent + tray)
        run: |
          scripts/build.sh linux-x64 win-x64
          test -x artifacts/publish/linux-x64/sdz-agent
          test -x artifacts/publish/linux-x64/sdz-agent-tray
          test -f artifacts/publish/win-x64/sdz-agent.exe
          test -f artifacts/publish/win-x64/sdz-agent-tray.exe
          artifacts/publish/linux-x64/sdz-agent version
      - name: Build with ODBC (cgo, linux-x64)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc-dev
          CGO_ENABLED=1 go build -tags odbc -o /tmp/sdz-agent-odbc ./cmd/sdz-agent
