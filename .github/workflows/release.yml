name: release

# Tag a commit as vX.Y.Z (matching <Version> in Directory.Build.props) to build and publish
# the installers for every platform plus manifest.json for the agent's self-update.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROPS="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          if [ "$TAG" != "$PROPS" ]; then
            echo "tag v$TAG does not match Directory.Build.props <Version>$PROPS</Version>" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tgz "$(curl -fsSL https://api.github.com/repos/goreleaser/nfpm/releases/latest | grep browser_download_url | grep 'linux_x86_64.tar.gz"' | head -1 | sed 's/.*"\(https[^"]*\)".*/\1/')"
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
          nfpm --version
      - name: Publish
        run: scripts/publish.sh linux-x64 linux-arm64
      - name: Package deb/rpm
        run: |
          scripts/package-linux.sh linux-x64 "${{ needs.version.outputs.version }}"
          scripts/package-linux.sh linux-arm64 "${{ needs.version.outputs.version }}"
      - name: Smoke test (deb install in container)
        run: |
          docker run --rm -v "$PWD/artifacts:/a" ubuntu:24.04 bash -c \
            "apt-get update -qq && apt-get install -y -qq /a/sdz-agent_${{ needs.version.outputs.version }}_amd64.deb >/dev/null && /opt/sdz-agent/sdz-agent version && test -x /opt/sdz-agent/sdz-agent-tray && test -f /etc/xdg/autostart/sdz-agent-tray.desktop && getent group sdz-agent"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            artifacts/*.deb
            artifacts/*.rpm
            installer/linux/install.sh

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish win-x64 (agent + tray)
        shell: bash
        run: scripts/publish.sh win-x64
      - name: Import code-signing certificate
        if: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        env:
          PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
      - name: Sign executables
        if: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        env:
          PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD artifacts\publish\win-x64\sdz-agent.exe artifacts\publish\win-x64\sdz-agent-tray.exe
      - name: Build MSI
        run: dotnet build installer/windows/Sdz.Agent.Installer.wixproj -c Release
      - name: Sign MSI
        if: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        env:
          PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD (Get-ChildItem artifacts\*.msi).FullName
      - name: Build setup.exe (NSIS wizard; also the self-update package)
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $nsis /V2 "/DVERSION=$version" "/DPRODUCT_NAME=SDZ Agent" "/DREG_KEY=sdz-agent-dotnet" `
            "/DPUBLISH_DIR=$PWD\artifacts\publish\win-x64" "/DOUT_FILE=$PWD\artifacts\sdz-agent-$version-win-x64-setup.exe" `
            "/DICON_FILE=$PWD\installer\windows\seedz.ico" "/DLICENSE_FILE=$PWD\LICENSE" installer\windows\nsis\sdz-agent.nsi
      - name: Sign setup.exe
        if: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD (Get-ChildItem artifacts\*-setup.exe).FullName
      - name: Smoke test (silent install without credentials)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem artifacts\*.msi).FullName
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v $env:RUNNER_TEMP\install.log" -Wait -NoNewWindow
          Get-Content $env:RUNNER_TEMP\install.log -Tail 5
          & "C:\Program Files\SEEDZ\sdz-agent\sdz-agent.exe" version
          if (-not (Test-Path "C:\Program Files\SEEDZ\sdz-agent\sdz-agent-tray.exe")) { throw "tray exe missing" }
          if (-not (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -Name SdzAgentTray -ErrorAction SilentlyContinue)) { throw "tray Run entry missing" }
          (Get-Service SDZ-AGENT).Status
          Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -NoNewWindow
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            artifacts/*.msi
            artifacts/*-setup.exe

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: scripts/publish.sh osx-x64 osx-arm64
      - name: Import signing certificates
        if: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Codesign binaries
        if: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APP_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
        run: |
          for rid in osx-x64 osx-arm64; do
            codesign --force --sign "$APP_IDENTITY" --options runtime --timestamp "artifacts/publish/$rid/sdz-agent"
            codesign --force --sign "$APP_IDENTITY" --options runtime --timestamp "artifacts/publish/$rid/sdz-agent-tray"
          done
      - name: Store notarization credentials
        if: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_ID != '' }}
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials sdz-agent --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build pkg
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.APPLE_ID != '' && 'sdz-agent' || '' }}
        run: |
          installer/macos/build-pkg.sh osx-x64 "${{ needs.version.outputs.version }}"
          installer/macos/build-pkg.sh osx-arm64 "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: artifacts/*.pkg

  release:
    needs: [version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Manifest
        run: |
          scripts/make-manifest.sh "${{ needs.version.outputs.version }}" stable
          (cd artifacts && sha256sum *.msi *.deb *.rpm *.pkg > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          name: sdz-agent ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg
            artifacts/manifest.json
            artifacts/SHA256SUMS.txt
            artifacts/install.sh
